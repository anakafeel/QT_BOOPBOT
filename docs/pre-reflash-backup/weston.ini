[core]
modules=screen-share.so
#xwayland=true
shell=qnx-desktop-shell.so
#gbm-format=xrgb2101010
#require-input=true

[shell]
client=/usr/lib/weston-qnx-desktop-shell
panel-position=none
background-image=/usr/share/backgrounds/qnx/background_robotics_2160p.png
#background-color=0xff002244
background-type=scale
taskbar-colour=0x88f4ebe1
taskbar-position=bottom
taskbar_default_icon=/usr/share/icons/gnome/16x16/categories/applications-other.png
clock-format=minutes
panel-color=0xffff443A
locking=true
animation=zoom
startup-animation=fade
#binding-modifier=ctrl
#num-workspaces=6
#cursor-theme=whiteglass
#cursor-size=24
locking=true
lockscreen-icon=/usr/share/icons/nuoveXT2/128x128/actions/lock.png
lockscreen=/usr/share/backgrounds/qnx/background_auto_robotics_720p.png
#homescreen=/usr/share/backgrounds/gnome/Blinds.jpg
animation=fade

[autolaunch]
path=/usr/bin/xfce4-session

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/org.xfce.appfinder.png
appid=xfce4-appfinder

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/org.xfce.terminal.png
appid=xfce4-terminal

[launcher]
icon=/usr/share/icons/nuoveXT2/16x16/apps/xfce-filemanager.png
appid=xfce4-file-manager

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/org.xfce.settings.manager.png
appid=xfce4-settings-manager

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/org.xfce.settings.appearance.png
appid=xfce4-appearance-settings

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/org.xfce.settings.default-applications.png
appid=xfce4-mime-settings

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/org.xfce.settings.display.png
appid=xfce4-display-settings

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/org.xfce.panel.png
appid=Panel Preferences

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/org.xfce.panel.png
appid=panel-desktop-handler

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/org.xfce.session.png
appid=xfce4-session-settings

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/org.xfce.settings.editor.png
appid=xfce4-settings-editor

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/org.xfce.thunar.png
appid=Thunar

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/geany.png
appid=geany

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/gtk3-demo.png
appid=gtk3-demo

[launcher]
icon=/usr/share/icons/gnome/16x16/categories/applications-other.png
appid=gtk3-icon-browser

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/gtk3-widget-factory.png
appid=gtk3-widget-factory

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/emacs.png
appid=emacs

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/org.xfce.webbrowser.png
appid=epiphany

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/org.gnome.gThumb.png
appid=org.gnome.gThumb

[launcher]
icon=/usr/share/icons/gnome/16x16/apps/accessories-calculator.png
appid=mate-calc

#[launcher]
#icon=/usr/share/icons
#appid=

[launcher]
icon=/usr/share/icons/hicolor/16x16/apps/org.xfce.about.png
appid=xfce4-about

[input-method]
path=/usr/lib/weston-keyboard

#[output]
#name=LVDS1
#mode=1680x1050
#transform=90
#icc_profile=/usr/share/color/icc/colord/Bluish.icc

#[output]
#name=VGA1
#mode=173.00  1920 2048 2248 2576  1080 1083 1088 1120 -hsync +vsync
#transform=flipped

#[output]
#name=X1
#mode=1024x768@60
#transform=flipped-90

#[output]
#name=QS1
#mode=800x600@60
#position=240,20
#display=2
#transform=flipped-90

#[libinput]
#enable-tap=true
#tap-and-drag=true
#tap-and-drag-lock=true
#disable-while-typing=false
#middle-button-emulation=true
#left-handed=true
#rotation=90
#accel-profile=flat
#accel-speed=.9
#natural-scroll=true
#scroll-method=edge
# For button-triggered scrolling:
#scroll-method=button
#scroll-button=BTN_RIGHT

#[touchpad]
#constant_accel_factor = 50
#min_accel_factor = 0.16
#max_accel_factor = 1.0

[screen-share]
command=/usr/sbin/weston --no-config  --backend=qnx-screen-backend.so --shell=fullscreen-shell.so

#TODO: re-enable when XWayland is ported
#[xwayland]
#path=/usr/bin/Xwayland
